<style>
:root{--g:#147d4b;--gd:#0a5131;--ink:#17241d;--mut:#5e6d65;--bg:#eef3ef;--card:#fff;--line:#d4ded7;--warn:#9a5b00;--bad:#b42318;--ok:#16794b;--focus:#ffcc00}*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,var(--gd),var(--g));color:white;padding:14px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between}.brand{font-weight:800;letter-spacing:.2px}.brand small{display:block;font-size:12px;font-weight:500;opacity:.85}.wrap{max-width:1180px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 22px #183d2810;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}@media(max-width:800px){.c8,.c6,.c4,.c3{grid-column:span 12}.top{align-items:flex-start}.hide-sm{display:none}}label{display:block;font-weight:700;margin:0 0 6px}.help{font-size:13px;color:var(--mut)}input,select,textarea{width:100%;border:1px solid #abbab1;border-radius:8px;padding:10px;background:white}input:focus,select:focus,textarea:focus,button:focus{outline:3px solid var(--focus);outline-offset:2px}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--g);color:white;font-weight:750}.btn.alt{background:#e8f2ec;color:var(--gd);border:1px solid #a9cbb8}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.55;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#e8f2ec;color:var(--gd);font-size:12px;font-weight:800}.pill.bad{background:#fee4e2;color:var(--bad)}.pill.warn{background:#fff1cf;color:var(--warn)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 12px}nav button.active{background:var(--gd);color:white}.progress{height:10px;background:#dfe8e2;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--g)}.lesson{max-width:850px}.lesson h2{color:var(--gd)}.lesson li{margin:.45em 0}.callout{border-left:5px solid var(--g);padding:12px;background:#eef8f2;border-radius:8px}.stop{border-color:var(--bad);background:#fff0ef}.question{border-top:1px solid var(--line);padding:15px 0}.option{display:flex;gap:8px;align-items:flex-start;margin:7px 0}.option input{width:auto;margin-top:5px}.muted{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.toast{position:fixed;right:18px;bottom:18px;background:#17241d;color:white;padding:12px 16px;border-radius:10px;z-index:20}.login{max-width:520px;margin:5vh auto}.hidden{display:none!important}.score{font-size:38px;font-weight:850;color:var(--gd)}.lang button{background:#ffffff28;border:1px solid #ffffff55;color:white;border-radius:7px;padding:5px 8px}.voicebar{position:sticky;top:0;background:#f6faf7;border:1px solid var(--line);padding:10px;border-radius:9px;z-index:2}.checkrow{display:grid;grid-template-columns:1fr 140px;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:600px){.checkrow{grid-template-columns:1fr}}
</style>

<header class="top"><div class="brand">PTW Learning & Competency<small id="subbrand">Invigilated training, knowledge and practical assessment</small></div><div class="row"><span id="who"></span><div class="lang"><button onclick="setLang('en')">EN</button><button onclick="setLang('id')">ID</button><button onclick="setLang('ms')">MS</button></div><button id="logoutBtn" class="btn alt hidden" onclick="logout()">Sign out</button></div></header>
<main id="app" class="wrap" aria-live="polite"></main><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbyRjZchmtRJX-RVtRwZgOIRdD7F01gIa7F4fpRRV0GyStlj5lAwUdhX3UoJMwRKnznM/exec';
/* PREVIEW MODE (open index.html?preview=1): read-only walkthrough of every screen with sample content.
   No login, no network calls, nothing saved. Shows the starter course text and questions (no answer key, no learner data). */
const PREVIEW=new URLSearchParams(location.search).has('preview');
const PREVIEW_COURSE={"title": "Permit to Work Competency", "description": "Invigilated PTW training aligned to the approved company procedure. The procedure remains the governing document.", "modules": [{"id": "M1", "title": {"en": "Why PTW matters", "id": "Mengapa PTW penting", "ms": "Mengapa PTW penting"}, "html": {"en": "<p>A permit is not permission to work without thinking. It is a formal communication and control process for hazardous work.</p><div class=\"callout stop\"><strong>Stop work</strong> if scope, conditions, isolation or simultaneous operations change.</div>", "id": "<p>Izin kerja adalah proses komunikasi dan pengendalian formal untuk pekerjaan berbahaya.</p><div class=\"callout stop\"><strong>Hentikan pekerjaan</strong> jika ruang lingkup, kondisi, isolasi, atau pekerjaan bersamaan berubah.</div>", "ms": "<p>Permit kerja ialah proses komunikasi dan kawalan formal bagi kerja berbahaya.</p>"}}, {"id": "M2", "title": {"en": "Roles and responsibilities", "id": "Peran dan tanggung jawab", "ms": "Peranan dan tanggungjawab"}, "html": {"en": "<ul><li>Area Owner confirms plant and area conditions.</li><li>Job Coordinator defines and controls the work.</li><li>Permit Authorizer independently verifies authorization requirements.</li><li>The work party understands the scope, hazards and controls.</li></ul>", "id": "<ul><li>Area Owner memastikan kondisi area.</li><li>Job Coordinator menetapkan serta mengendalikan pekerjaan.</li><li>Permit Authorizer memverifikasi persyaratan izin.</li></ul>", "ms": "<ul><li>Pemilik Kawasan mengesahkan keadaan kawasan.</li><li>Penyelaras Kerja mengawal kerja.</li></ul>"}}, {"id": "M3", "title": {"en": "Plan and define the job", "id": "Rencanakan dan definisikan pekerjaan", "ms": "Rancang dan takrifkan kerja"}, "html": {"en": "<p>Use an exact scope, exact location, equipment identity, start and finish time, work method and boundaries. Avoid vague descriptions.</p>", "id": "<p>Gunakan ruang lingkup, lokasi, identitas peralatan, waktu, metode, dan batas pekerjaan yang tepat.</p>", "ms": "<p>Gunakan skop, lokasi, identiti peralatan, masa dan kaedah yang tepat.</p>"}}, {"id": "M4", "title": {"en": "Hazards, controls and isolation", "id": "Bahaya, pengendalian, dan isolasi", "ms": "Bahaya, kawalan dan pengasingan"}, "html": {"en": "<p>Identify task, process, area and SIMOPS hazards. Verify isolation and zero energy before starting where required.</p>", "id": "<p>Identifikasi bahaya tugas, proses, area, dan SIMOPS. Verifikasi isolasi dan energi nol jika diperlukan.</p>", "ms": "<p>Kenal pasti bahaya tugas, proses, kawasan dan SIMOPS.</p>"}}, {"id": "M5", "title": {"en": "Supporting certificates and checklists", "id": "Sertifikat dan checklist pendukung", "ms": "Sijil dan senarai semak sokongan"}, "html": {"en": "<ul><li>Hot work</li><li>Confined space</li><li>Excavation</li><li>Electrical and high voltage</li><li>Lifting</li><li>Working at height</li></ul>", "id": "<ul><li>Pekerjaan panas</li><li>Ruang terbatas</li><li>Penggalian</li><li>Listrik</li><li>Pengangkatan</li><li>Bekerja di ketinggian</li></ul>", "ms": "<p>Pilih sijil dan senarai semak berdasarkan bahaya sebenar.</p>"}}, {"id": "M6", "title": {"en": "Authorization and site verification", "id": "Otorisasi dan verifikasi lokasi", "ms": "Kebenaran dan pengesahan tapak"}, "html": {"en": "<p>Signatures confirm checks were performed. They are not administrative decoration. Verify the site and safeguards before issue.</p>", "id": "<p>Tanda tangan menegaskan pemeriksaan telah dilakukan. Verifikasi lokasi dan pengendalian sebelum penerbitan.</p>", "ms": "<p>Tandatangan mengesahkan pemeriksaan telah dilakukan.</p>"}}, {"id": "M7", "title": {"en": "Toolbox Talk and dynamic risk assessment", "id": "Toolbox Talk dan penilaian risiko dinamis", "ms": "Toolbox Talk dan penilaian risiko dinamik"}, "html": {"en": "<p>Every person must understand the task, hazards, controls, emergency actions and stop-work expectations in a language they understand.</p>", "id": "<p>Setiap orang harus memahami tugas, bahaya, pengendalian, tindakan darurat, dan kewajiban stop work.</p>", "ms": "<p>Setiap orang mesti memahami tugas, bahaya, kawalan dan tindakan kecemasan.</p>"}}, {"id": "M8", "title": {"en": "Revalidation, suspension and closure", "id": "Revalidasi, penangguhan, dan penutupan", "ms": "Pengesahan semula, penggantungan dan penutupan"}, "html": {"en": "<p>Revalidate only after checking that scope, people, conditions, isolation and SIMOPS remain acceptable. Close only after the worksite and equipment are left safe.</p>", "id": "<p>Revalidasi hanya setelah memastikan ruang lingkup, personel, kondisi, isolasi, dan SIMOPS tetap aman.</p>", "ms": "<p>Sahkan semula hanya selepas keadaan disemak.</p>"}}, {"id": "M9", "title": {"en": "Human factors and learning from incidents", "id": "Faktor manusia dan pembelajaran insiden", "ms": "Faktor manusia dan pembelajaran insiden"}, "html": {"en": "<p>Challenge assumptions, avoid copying old permits, control time pressure, and confirm field reality. A good permit supports a good conversation.</p>", "id": "<p>Tantang asumsi, jangan menyalin izin lama, kendalikan tekanan waktu, dan pastikan kondisi lapangan.</p>", "ms": "<p>Cabaran andaian dan sahkan keadaan sebenar di lapangan.</p>"}}, {"id": "M10", "title": {"en": "Practical PTW preparation", "id": "Praktik pembuatan PTW", "ms": "Amali penyediaan PTW"}, "html": {"en": "<p>Prepare a complete permit for a simple activity. The invigilator checks accuracy, control selection, communication and field understanding.</p>", "id": "<p>Siapkan izin lengkap untuk aktivitas sederhana. Invigilator memeriksa ketepatan dan pemahaman.</p>", "ms": "<p>Sediakan permit lengkap untuk aktiviti mudah.</p>"}}], "questions": [{"id": "Q1", "text": {"en": "What is the primary purpose of a PTW system?"}, "options": [{"key": "A", "text": {"en": "Replace risk assessment"}}, {"key": "B", "text": {"en": "Formally control and communicate hazardous work"}}, {"key": "C", "text": {"en": "Record payroll time"}}, {"key": "D", "text": {"en": "Avoid site inspection"}}]}, {"id": "Q2", "text": {"en": "What should happen if work conditions or scope change?"}, "options": [{"key": "A", "text": {"en": "Continue quickly"}}, {"key": "B", "text": {"en": "Stop, reassess and re-authorize as required"}}, {"key": "C", "text": {"en": "Change the permit later"}}, {"key": "D", "text": {"en": "Ask only the contractor"}}]}, {"id": "Q3", "text": {"en": "Which description is best?"}, "options": [{"key": "A", "text": {"en": "Maintenance work"}}, {"key": "B", "text": {"en": "General repair"}}, {"key": "C", "text": {"en": "Replace corroded support S-14 at north utility rack using hand tools"}}, {"key": "D", "text": {"en": "As discussed"}}]}, {"id": "Q4", "text": {"en": "When is a Toolbox Talk effective?"}, "options": [{"key": "A", "text": {"en": "When only the supervisor signs"}}, {"key": "B", "text": {"en": "When the team understands scope, hazards, controls and stop-work expectations"}}, {"key": "C", "text": {"en": "After the job"}}, {"key": "D", "text": {"en": "Only for hot work"}}]}, {"id": "Q5", "text": {"en": "Who may bypass a required safeguard?"}, "options": [{"key": "A", "text": {"en": "Anyone experienced"}}, {"key": "B", "text": {"en": "No one without the required formal authorization"}}, {"key": "C", "text": {"en": "The fastest worker"}}, {"key": "D", "text": {"en": "Any contractor"}}]}, {"id": "Q6", "text": {"en": "Why must SIMOPS be reviewed?"}, "options": [{"key": "A", "text": {"en": "Nearby work can introduce conflicting hazards"}}, {"key": "B", "text": {"en": "To reduce paperwork"}}, {"key": "C", "text": {"en": "Only for night shift"}}, {"key": "D", "text": {"en": "It is optional"}}]}, {"id": "Q7", "text": {"en": "When should a permit be closed?"}, "options": [{"key": "A", "text": {"en": "When the crew leaves"}}, {"key": "B", "text": {"en": "After work and area are verified safe and handback is complete"}}, {"key": "C", "text": {"en": "At shift end regardless of status"}}, {"key": "D", "text": {"en": "Before inspection"}}]}, {"id": "Q8", "text": {"en": "What does an authorization signature mean?"}, "options": [{"key": "A", "text": {"en": "The required checks were personally performed"}}, {"key": "B", "text": {"en": "The form looks complete"}}, {"key": "C", "text": {"en": "Responsibility moved to someone else"}}, {"key": "D", "text": {"en": "The job cannot change"}}]}, {"id": "Q9", "text": {"en": "What is required before work on isolated equipment?"}, "options": [{"key": "A", "text": {"en": "Assume isolation is adequate"}}, {"key": "B", "text": {"en": "Verify isolation and zero energy as applicable"}}, {"key": "C", "text": {"en": "Only attach a label"}}, {"key": "D", "text": {"en": "Start with low-risk work"}}]}, {"id": "Q10", "text": {"en": "A supporting checklist should be selected based on:"}, "options": [{"key": "A", "text": {"en": "Actual hazards and work type"}}, {"key": "B", "text": {"en": "Which form is shortest"}}, {"key": "C", "text": {"en": "Contractor preference only"}}, {"key": "D", "text": {"en": "Previous job title"}}]}, {"id": "Q11", "text": {"en": "What should happen if a critical control is missing?"}, "options": [{"key": "A", "text": {"en": "Record it and continue"}}, {"key": "B", "text": {"en": "Stop work until corrected and verified"}}, {"key": "C", "text": {"en": "Ignore it for a short task"}}, {"key": "D", "text": {"en": "Reduce the crew"}}]}, {"id": "Q12", "text": {"en": "Why is a field visit important?"}, "options": [{"key": "A", "text": {"en": "It verifies the permit against actual conditions"}}, {"key": "B", "text": {"en": "It replaces the permit"}}, {"key": "C", "text": {"en": "It is only for photographs"}}, {"key": "D", "text": {"en": "It avoids Toolbox Talk"}}]}, {"id": "Q13", "text": {"en": "Who must understand the permit controls?"}, "options": [{"key": "A", "text": {"en": "Only the authorizer"}}, {"key": "B", "text": {"en": "Everyone involved in the work"}}, {"key": "C", "text": {"en": "Only HSSE"}}, {"key": "D", "text": {"en": "Only company employees"}}]}, {"id": "Q14", "text": {"en": "Can an old permit be copied without checking the field?"}, "options": [{"key": "A", "text": {"en": "Yes"}}, {"key": "B", "text": {"en": "No, current scope and conditions must be assessed"}}, {"key": "C", "text": {"en": "Only on day shift"}}, {"key": "D", "text": {"en": "Only by an invigilator"}}]}, {"id": "Q15", "text": {"en": "What is the final competency decision based on?"}, "options": [{"key": "A", "text": {"en": "Attendance only"}}, {"key": "B", "text": {"en": "Knowledge plus satisfactory practical demonstration and sign-off"}}, {"key": "C", "text": {"en": "Years of service only"}}, {"key": "D", "text": {"en": "Email activation"}}]}]};
function previewApi(action,data){
  const t=(en,id,ms)=>({en,id:id||en,ms:ms||en});
  const sample='<p><strong>SAMPLE TEXT – replace with approved course content.</strong></p><p>This placeholder shows how a module looks, including headings, lists and the voice-over button.</p><ul><li>First sample point</li><li>Second sample point</li></ul>';
  const R={
    me:{user:{fullName:'Preview Learner',role:'ADMIN'}},
    dashboard:{progress:40,sessions:[{sessionId:'PREVIEW-001',courseTitle:'PTW Learning & Competency (sample)',date:'2026-11-01',status:'SAMPLE'}]},
    joinSession:{session:{sessionId:'PREVIEW-001'}},
    getCourse:{course:PREVIEW_COURSE},
    completeModule:{},
    startAssessment:{assessmentId:'PREVIEW',passMark:80,questions:PREVIEW_COURSE.questions.map(q=>({id:q.id,text:q.text.en,options:q.options.map(o=>({key:o.key,text:o.text.en}))}))},
    submitAssessment:{score:100,passed:true,message:'Preview only – this result is not real and nothing was saved.'},
    getPractical:{practical:{scenario:'Sample scenario: replace a damaged non-process water-line support using hand tools in an operating utility area.',workDescription:''}},
    savePractical:{message:'Preview only – nothing was saved.'},
    adminSummary:{users:0,sessions:0,completed:0},
    adminCreateUser:{},
    logout:{}
  };
  if(!(action in R)) throw Error('Not available in preview');
  return Promise.resolve(Object.assign({ok:true},R[action]));
}
const S={token:sessionStorage.getItem('ptw_token')||'',user:null,lang:localStorage.getItem('ptw_lang')||'en',course:null,session:null,answers:{}};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){let e=$('#toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
async function api(action,data={}){if(PREVIEW)return previewApi(action,data);if(API_URL.startsWith('PASTE_')) throw Error('Set API_URL in index.html after deploying Code.gs.');let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,...data})});let j=await r.json();if(!j.ok)throw Error(j.message||j.error||'Request failed');return j}
function setLang(l){S.lang=l;localStorage.setItem('ptw_lang',l);router()}
function shell(body,tab=''){let tabs=S.user?`<nav>${['dashboard','learn','assessment','practical'].map(x=>`<button class="${tab===x?'active':''}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}${S.user.role==='ADMIN'?'<button onclick="go(\'admin\')">Admin</button>':''}</nav>`:'';$('#app').innerHTML=tabs+body;$('#logoutBtn').classList.toggle('hidden',!S.user);$('#who').textContent=S.user?`${S.user.fullName} · ${S.user.role}`:''}
function go(p){location.hash=p;router()}
async function init(){if(PREVIEW){S.user=(await api('me')).user;let b=document.createElement('div');b.style.cssText='background:#ffcc00;color:#17241d;text-align:center;padding:6px;font-weight:700';b.textContent='PREVIEW – read-only, nothing is saved (answer key not shown)';document.body.prepend(b);return router()}if(S.token){try{let j=await api('me');S.user=j.user}catch(e){sessionStorage.removeItem('ptw_token');S.token=''}}router()}
function router(){if(!S.user)return renderLogin();let p=location.hash.slice(1)||'dashboard';({dashboard,learn,assessment,practical,admin}[p]||dashboard)().catch(e=>shell(`<div class="card"><h2>Error</h2><p>${esc(e.message)}</p></div>`))}
function renderLogin(){shell(`<section class="card login"><h1>Secure access</h1><p>Only pre-registered users may activate or sign in.</p><div class="grid"><div class="c12"><label>Username</label><input id="u" autocomplete="username"></div><div class="c12"><label>PIN / password</label><input id="p" type="password" autocomplete="current-password"></div><div class="c12 row"><button class="btn" onclick="login()">Sign in</button><button class="btn alt" onclick="activationForm()">Activate account</button><button class="btn alt" onclick="resetForm()">Forgot PIN</button></div></div><p class="help">Access is limited to registered users and assigned invigilated sessions.</p></section>`)}
async function login(){try{let j=await api('login',{username:$('#u').value,password:$('#p').value});S.token=j.token;S.user=j.user;sessionStorage.setItem('ptw_token',S.token);go('dashboard')}catch(e){toast(e.message)}}
function activationForm(){shell(`<section class="card login"><h1>Activate account</h1><p>Your username and email must already be registered by the administrator.</p><label>Username</label><input id="u"><label>Registered email</label><input id="e" type="email"><div class="row" style="margin-top:14px"><button class="btn" onclick="sendOtp('ACTIVATE')">Send OTP</button><button class="btn alt" onclick="renderLogin()">Back</button></div><div id="otpbox"></div></section>`)}
function resetForm(){shell(`<section class="card login"><h1>Reset PIN</h1><label>Username</label><input id="u"><label>Registered email</label><input id="e" type="email"><div class="row" style="margin-top:14px"><button class="btn" onclick="sendOtp('RESET')">Send OTP</button><button class="btn alt" onclick="renderLogin()">Back</button></div><div id="otpbox"></div></section>`)}
async function sendOtp(purpose){try{await api('requestOtp',{username:$('#u').value,email:$('#e').value,purpose});$('#otpbox').innerHTML=`<hr><label>One-time password</label><input id="otp" inputmode="numeric"><label>New PIN / password</label><input id="np" type="password"><p class="help">Use at least 10 characters, including letters and numbers.</p><button class="btn" onclick="completeOtp('${purpose}')">Confirm</button>`;toast('If the account is eligible, an OTP has been sent.')}catch(e){toast(e.message)}}
async function completeOtp(purpose){try{await api('verifyOtpSetPassword',{username:$('#u').value,email:$('#e').value,otp:$('#otp').value,newPassword:$('#np').value,purpose});toast('Updated. Sign in now.');setTimeout(renderLogin,700)}catch(e){toast(e.message)}}
async function logout(){if(PREVIEW){location.href=location.pathname;return}try{await api('logout')}catch(e){}S.token='';S.user=null;sessionStorage.removeItem('ptw_token');renderLogin()}
async function dashboard(){let j=await api('dashboard');let sess=j.sessions||[];shell(`<div class="grid"><section class="card c8"><h1>Welcome, ${esc(S.user.fullName)}</h1><p>This programme builds PTW understanding, then verifies knowledge and practical ability under an invigilator.</p><div class="callout"><strong>Competency path:</strong> Learn → knowledge assessment → practical PTW → invigilator sign-off.</div></section><section class="card c4"><h3>Course progress</h3><div class="score">${j.progress||0}%</div><div class="progress"><i style="width:${j.progress||0}%"></i></div></section><section class="card c12"><h2>Assigned sessions</h2>${sess.length?`<table><tr><th>Session</th><th>Course</th><th>Date</th><th>Status</th><th></th></tr>${sess.map(x=>`<tr><td>${esc(x.sessionId)}</td><td>${esc(x.courseTitle)}</td><td>${esc(x.date)}</td><td><span class="pill">${esc(x.status)}</span></td><td><button class="btn" onclick="joinSession('${esc(x.sessionId)}')">Open</button></td></tr>`).join('')}</table>`:'<p>No assigned session.</p>'}</section></div>`,'dashboard')}
async function joinSession(id){let code=prompt('Enter the code displayed by the invigilator');if(!code)return;try{let j=await api('joinSession',{sessionId:id,sessionCode:code});S.session=j.session;toast('Session opened');go('learn')}catch(e){toast(e.message)}}
async function learn(){let j=await api('getCourse',{sessionId:S.session?.sessionId||''});S.course=j.course;let ms=j.course.modules||[];let nav=ms.map((m,i)=>`<button class="btn alt" onclick="showModule(${i})">${i+1}. ${esc(m.title[S.lang]||m.title.en)}</button>`).join('');shell(`<section class="card"><h1>${esc(j.course.title)}</h1><p>${esc(j.course.description)}</p><div class="row">${nav}</div></section><section id="lesson" class="card lesson"><p>Select a module.</p></section>`,'learn');if(ms.length)showModule(0)}
function showModule(i){let m=S.course.modules[i], title=m.title[S.lang]||m.title.en, html=m.html[S.lang]||m.html.en;$('#lesson').innerHTML=`<div class="voicebar row between"><strong>${esc(title)}</strong><div class="row"><button class="btn alt" onclick="speakLesson()">▶ Voice-over</button><button class="btn alt" onclick="speechSynthesis.cancel()">■ Stop</button></div></div><h2>${esc(title)}</h2><div id="lessonText">${html}</div><hr><button class="btn" onclick="completeModule('${esc(m.id)}')">Mark module complete</button>`;window.scrollTo({top:0,behavior:'smooth'})}
function speakLesson(){let text=$('#lessonText').innerText;let u=new SpeechSynthesisUtterance(text);u.lang={en:'en-US',id:'id-ID',ms:'ms-MY'}[S.lang];speechSynthesis.cancel();speechSynthesis.speak(u)}
async function completeModule(id){try{await api('completeModule',{sessionId:S.session?.sessionId||'',moduleId:id});toast('Progress saved')}catch(e){toast(e.message)}}
async function assessment(){let j=await api('startAssessment',{sessionId:S.session?.sessionId||''});let qs=j.questions;S.assessmentId=j.assessmentId;shell(`<section class="card"><h1>Knowledge assessment</h1><p>Pass mark: ${j.passMark}%. Complete under invigilation. Questions and options may be randomized.</p>${qs.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q.text)}</strong>${q.options.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${esc(o.key)}"> <span>${esc(o.text)}</span></label>`).join('')}</div>`).join('')}<button class="btn" onclick="submitAssessment()">Submit assessment</button></section>`,'assessment');S.questions=qs}
async function submitAssessment(){let answers=S.questions.map((q,i)=>({questionId:q.id,answer:(document.querySelector(`input[name=q${i}]:checked`)||{}).value||''}));if(answers.some(x=>!x.answer))return toast('Answer every question.');try{let j=await api('submitAssessment',{assessmentId:S.assessmentId,sessionId:S.session?.sessionId||'',answers});shell(`<section class="card"><h1>Assessment result</h1><div class="score">${j.score}%</div><p><span class="pill ${j.passed?'':'bad'}">${j.passed?'PASS':'NOT YET COMPETENT'}</span></p><p>${esc(j.message)}</p><button class="btn" onclick="go('practical')">Continue to practical assessment</button></section>`,'assessment')}catch(e){toast(e.message)}}
async function practical(){let j=await api('getPractical',{sessionId:S.session?.sessionId||''});let p=j.practical;shell(`<section class="card"><h1>Practical assessment: create a PTW</h1><div class="callout"><strong>Scenario:</strong> ${esc(p.scenario)}</div><p>The learner prepares the permit. The invigilator verifies the field discussion and final controls.</p><form id="ptw"><div class="grid">${field('workDescription','Work description',p.workDescription||'','c12','textarea')}${field('location','Exact work location','','c6')}${field('equipment','Equipment / system','','c6')}${field('start','Planned start','','c6','datetime-local')}${field('end','Planned finish','','c6','datetime-local')}<div class="c6"><label>Work type</label><select name="workType"><option>Cold Work</option><option>Hot Work</option><option>Working at Height</option><option>Excavation</option><option>Confined Space</option><option>Electrical</option><option>Lifting</option></select></div><div class="c6"><label>Energy isolation required?</label><select name="isolation"><option value="">Select</option><option>Yes</option><option>No</option></select></div>${field('hazards','Key hazards','','c12','textarea')}${field('controls','Controls and safeguards','','c12','textarea')}${field('tools','Tools / equipment','','c6','textarea')}${field('ppe','Required PPE','','c6','textarea')}${field('supporting','Supporting certificates / checklists','','c12','textarea')}${field('tbt','Toolbox Talk points','','c12','textarea')}</div></form><div class="row"><button class="btn" onclick="savePractical(false)">Save draft</button><button class="btn" onclick="savePractical(true)">Submit to invigilator</button></div></section>`,'practical')}
function field(n,l,v,c='c6',t='text'){return `<div class="${c}"><label>${l}</label>${t==='textarea'?`<textarea name="${n}" rows="4">${esc(v)}</textarea>`:`<input name="${n}" type="${t}" value="${esc(v)}">`}</div>`}
async function savePractical(submit){let data=Object.fromEntries(new FormData($('#ptw')).entries());try{let j=await api('savePractical',{sessionId:S.session?.sessionId||'',data,submit});toast(j.message);if(j.pdfUrl)alert('Assessment PDF saved to Drive: '+j.pdfUrl)}catch(e){toast(e.message)}}
async function admin(){if(S.user.role!=='ADMIN')return shell('<div class="card">Not authorized.</div>');let j=await api('adminSummary');shell(`<div class="grid"><section class="card c4"><h2>Users</h2><div class="score">${j.users}</div></section><section class="card c4"><h2>Sessions</h2><div class="score">${j.sessions}</div></section><section class="card c4"><h2>Completed</h2><div class="score">${j.completed}</div></section><section class="card c12"><h2>Create invited user</h2><div class="grid">${field('au','Username','','c3')}${field('an','Full name','','c3')}${field('ae','Email','','c3','email')}<div class="c3"><label>Role</label><select id="ar"><option>PARTICIPANT</option><option>INVIGILATOR</option><option>ADMIN</option></select></div></div><button class="btn" onclick="addUser()">Add user</button></section><section class="card c12"><h2>Deployment controls</h2><p>Use the Apps Script setup function to create sheets, security properties and the Drive assessment folder. Keep all procedures and answer keys out of the public repository.</p></section></div>`)}
async function addUser(){try{await api('adminCreateUser',{username:$('[name=au]').value,fullName:$('[name=an]').value,email:$('[name=ae]').value,role:$('#ar').value});toast('User invited')}catch(e){toast(e.message)}}
window.addEventListener('hashchange',router);init();
</script></body></html>
